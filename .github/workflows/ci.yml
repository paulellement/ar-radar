name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true  # uv pip needs a venv; this creates and activates one
      - run: uv pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
