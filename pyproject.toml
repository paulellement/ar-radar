[project]
name = "anr_radar"
version = "0.1.0"
description = "A&R Radar: spot fast-growing small artists from public listening data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pandas>=2.2",
    "pyarrow>=16",
    "databricks-sdk>=0.40",
    "python-dotenv>=1.0",
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
anr-candidates = "anr_radar.collect.candidates:main"
anr-snapshot = "anr_radar.collect.snapshot:main"
anr-events = "anr_radar.collect.events:main"
anr-pipeline = "anr_radar.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anr_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "E501"]  # Databricks notebook sources
"src/anr_radar/transform/silver.py" = ["E501"]  # long SQL COMMENT strings
"src/anr_radar/transform/gold.py" = ["E501"]
"src/anr_radar/briefs/generate.py" = ["E501"]  # prompt text
