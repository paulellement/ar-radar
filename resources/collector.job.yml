resources:
  jobs:
    collector:
      name: anr-radar-daily
      description: >-
        Daily: upcoming Ticketmaster events, then the Last.fm snapshot (adds show performers to
        the pool; rebuilds it weekly), then the medallion pipeline.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # 06:00 UTC daily
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${var.alert_email}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: events
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: anr_radar
            entry_point: anr-events
            parameters: ["--root", "${var.landing_root}"]
        - task_key: snapshot
          # A failed events pull must not cost a day of Last.fm history.
          depends_on: [{task_key: events}]
          run_if: ALL_DONE
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 600000
          python_wheel_task:
            package_name: anr_radar
            entry_point: anr-snapshot
            parameters: ["--root", "${var.landing_root}"]
        - task_key: pipeline
          depends_on: [{task_key: snapshot}]
          run_job_task:
            job_id: ${resources.jobs.pipeline.id}
